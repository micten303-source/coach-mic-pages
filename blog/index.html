<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Mic Blog</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f9f9f9; }
        header { background: linear-gradient(135deg, #1A3CA8 0%, #0D2270 100%); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .blog-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 1.5rem; }
        footer { background: #f0f0f0; padding: 2rem; text-align: center; color: #666; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>Coach Mic Blog</h1>
        <p>Praxistipps für Jugendfußballtrainer</p>
    </header>
    <div class="container">
        <div class="blog-grid" id="blog-posts">
            <p>Keine Blog-Posts vorhanden. Neue Artikel erscheinen hier in Kürze.</p>
        </div>
    </div>
    <footer>
        <p>© 2026 Coach Mic – Michael Otten</p>
    </footer>
</body>
</html>
