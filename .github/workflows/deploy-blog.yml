name: Coach Mic Blog Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Convert Blog
      run: python3 convert-to-blog.py
    - name: Deploy Netlify
      run: |
        curl -X POST \
          -H "User-Agent: Coach Mic Bot" \
          ${{ secrets.NETLIFY_DEPLOY_HOOK }}
